name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:0.8.7-pg17-bookworm
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test-only-ci-password
          POSTGRES_DB: threat_intel_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U test -d threat_intel_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_POSTGRES_URL: postgresql+psycopg://test:test-only-ci-password@localhost:5432/threat_intel_test
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.13.0"
          enable-cache: true
      - run: uv sync --frozen
      - run: uv run ruff check backend scripts tests
      - run: uv run ruff format --check backend scripts tests
      - run: uv run pytest --postgres-matrix
      - run: uv run python scripts/export_openapi.py
      - run: git diff --exit-code -- docs/openapi.json

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run format:check
      - run: npm test
      - run: npm run api:types
      - run: git diff --exit-code -- src/api/schema.d.ts
      - run: npm run build

  compose-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.13.0"
          enable-cache: true
      - run: uv sync --frozen
      - run: uv run python scripts/init_env.py
      - run: docker compose config --quiet
      - run: docker compose up --build -d --wait --wait-timeout 180
      - run: uv run python scripts/smoke_http.py
      - run: uv run python scripts/smoke_compose_recreate.py --project-name blended-threat-intel --env-file .env
      - run: uv run python scripts/smoke_http.py
      - if: failure()
        run: docker compose logs --no-color api worker migrate web
      - if: always()
        run: docker compose down
