name: blended-threat-intel

x-backend: &backend
  build:
    context: .
    dockerfile: infra/backend.Dockerfile
  environment:
    APP_ENV: development
    DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-threat_intel}:${POSTGRES_PASSWORD:?Run scripts/init_env.py first}@db:5432/${POSTGRES_DB:-threat_intel}
    DEV_API_TOKEN: ${DEV_API_TOKEN:?Run scripts/init_env.py first}
    WORKER_POLL_SECONDS: ${WORKER_POLL_SECONDS:-2}
    SUPPORTED_UBUNTU_RELEASE: ${SUPPORTED_UBUNTU_RELEASE:-}
    LLM_BASE_URL: ${LLM_BASE_URL:-}
    LLM_MODEL: ${LLM_MODEL:-}
    LLM_API_KEY: ${LLM_API_KEY:-}
    LLM_TIMEOUT_SECONDS: ${LLM_TIMEOUT_SECONDS:-45}
    LLM_MAX_TOKENS: ${LLM_MAX_TOKENS:-2200}
    NVD_API_KEY: ${NVD_API_KEY:-}
    SSH_ALLOWED_TARGETS: ${SSH_ALLOWED_TARGETS:-}
    SSH_KEY_DIRECTORY: /run/cti-ssh-keys
    SSH_KEY_PASSWORD: ${SSH_KEY_PASSWORD:-}
    SSH_TIMEOUT_SECONDS: ${SSH_TIMEOUT_SECONDS:-45}
    PACKAGE_CACHE_DIRECTORY: /var/cache/cti-packages
    PACKAGE_CACHE_MIB: ${PACKAGE_CACHE_MIB:-768}
    AUTH_MODE: ${AUTH_MODE:-token}
    SESSION_HOURS: ${SESSION_HOURS:-8}
    SESSION_COOKIE_SECURE: ${SESSION_COOKIE_SECURE:-false}
  volumes:
    - type: bind
      source: ${SSH_KEY_DIRECTORY:-./.data/ssh-keys}
      target: /run/cti-ssh-keys
      read_only: true
    - type: volume
      source: package-cache
      target: /var/cache/cti-packages
  init: true

services:
  db:
    image: pgvector/pgvector:0.8.7-pg17-bookworm
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-threat_intel}
      POSTGRES_USER: ${POSTGRES_USER:-threat_intel}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Run scripts/init_env.py first}
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10

  migrate:
    <<: *backend
    command: ["alembic", "upgrade", "head"]
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  api:
    <<: *backend
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v1/readiness', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 5

  worker:
    <<: *backend
    command: ["python", "-m", "backend.worker"]
    depends_on:
      migrate:
        condition: service_completed_successfully

  web:
    build:
      context: .
      dockerfile: infra/web.Dockerfile
    ports:
      - "127.0.0.1:${WEB_PORT:-8080}:8080"
    depends_on:
      api:
        condition: service_healthy

volumes:
  db-data:
  package-cache:
