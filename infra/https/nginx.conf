upstream cti_https_api {
    zone cti_https_api 64k;
    resolver 127.0.0.11 valid=5s ipv6=off;
    server api:8000 resolve;
}

# Internal readiness only. The HTTPS overlay does not publish port 8080.
server {
    listen 8080;
    server_name _;
    location = /api/v1/readiness {
        proxy_pass http://cti_https_api;
    }
    location / { return 404; }
}

server {
    listen 8443 ssl;
    server_name _;
    ssl_certificate /run/cti-tls/fullchain.pem;
    ssl_certificate_key /run/cti-tls/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:cti_tls:10m;
    ssl_session_timeout 10m;
    ssl_session_tickets off;

    root /usr/share/nginx/html;
    index index.html;
    client_max_body_size 2m;
    add_header Strict-Transport-Security "max-age=86400" always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy same-origin always;

    # Compare scheme, host AND port. Empty Origin remains valid for CLI clients;
    # the existing application still requires its CSRF token for session writes.
    set $cti_origin_allowed 0;
    if ($http_origin = "") { set $cti_origin_allowed 1; }
    if ($http_origin = "https://$http_host") { set $cti_origin_allowed 1; }
    if ($cti_origin_allowed = 0) { return 403; }

    location /api/ {
        proxy_pass http://cti_https_api;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $remote_addr;
    }
    location / {
        try_files $uri $uri/ /index.html;
    }
}
