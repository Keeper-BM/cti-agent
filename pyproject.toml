[project]
name = "blended-threat-intel"
version = "0.1.0"
description = "Ubuntu asset management and evidence-based vulnerability intelligence"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn>=0.34,<1",
  "pydantic-settings>=2.7,<3",
  "sqlalchemy>=2.0,<2.1",
  "alembic>=1.14,<2",
  "psycopg[binary]>=3.2,<4",
  "httpx>=0.28,<1",
  "beautifulsoup4>=4.12,<5",
  "paramiko>=4,<5",
  "zstandard>=0.23,<1",
]

[project.optional-dependencies]
dense = [
    "numpy>=1.26,<3",
    "sentence-transformers>=5,<6",
    "torch>=2.15,<2.16",
]
dense-cuda = [
    "numpy>=1.26,<3",
    "sentence-transformers>=5,<6",
    "torch>=2.15,<2.16",
]

[dependency-groups]
dev = [
  "pytest>=8.3,<9",
  "ruff>=0.11,<1",
  "pyyaml>=6,<7",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["backend"]

[tool.uv]
conflicts = [[{extra = "dense"}, {extra = "dense-cuda"}]]

[tool.uv.sources]
torch = [
    {index = "pytorch-cu132", extra = "dense-cuda", marker = "(sys_platform == 'win32' and platform_machine == 'AMD64') or (sys_platform == 'linux' and platform_machine == 'x86_64')"},
]

[[tool.uv.index]]
name = "pytorch-cu132"
url = "https://download.pytorch.org/whl/cu132"
explicit = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
"backend/api/routes/*.py" = ["B008"]
