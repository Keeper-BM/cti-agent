name: 결함 보고
description: 재현 가능한 현상, 기대 동작, 실행 환경을 기록합니다.
title: "[bug] 문제 요약"
body:
  - type: textarea
    id: reproduce
    attributes:
      label: 재현 절차
      description: 입력과 실행 순서를 기록합니다.
    validations:
      required: true
  - type: textarea
    id: result
    attributes:
      label: 기대 동작 및 실제 결과
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: 실행 환경 및 확인 자료
      description: 버전, OS, SQLite 또는 Compose 구성, 요청 ID를 기록합니다. 비밀정보는 제외합니다.
    validations:
      required: true
